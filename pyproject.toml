[tool.poetry]
name = "academic-pipeline-engine"
version = "0.1.0"
description = "AI-Powered Academic Documentation Pipeline with State Machine Orchestration"
authors = ["Lotargo"]
license = "MIT"
readme = "README.md"
packages = [{include = "academic_pe"}]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.0"
openai = "^1.0"
PyYAML = "^6.0"
python-docx = "^1.1"
matplotlib = "^3.8"
anthropic = "^0.70"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
requests = "^2.31.0"
deep-translator = "^1.11.4"
PyMuPDF = "^1.24.0"
Jinja2 = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
pythonpath = "."

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
