# Celery's control health check creates a non-durable, non-exclusive temporary
# reply queue, and its prefetch configuration uses global QoS. RabbitMQ 4.3
# disables both deprecated features by default. Keep the local service-dev
# broker compatible with the pinned client until its transport no longer needs
# either feature.
deprecated_features.permit.transient_nonexcl_queues = true
deprecated_features.permit.global_qos = true
