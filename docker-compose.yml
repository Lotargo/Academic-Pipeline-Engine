# Canonical direct Docker Compose entry point for the service development stack.
# Supabase remains a separate local stack (started through Supabase CLI) so its
# Auth/Postgres/Storage lifecycle is never folded into the application images.
name: academic-pipeline-engine-service-dev

services:
  broker:
    extends:
      file: docker-compose.service-dev.yml
      service: broker

  migrate:
    extends:
      file: docker-compose.service-dev.yml
      service: migrate

  backend:
    extends:
      file: docker-compose.service-dev.yml
      service: backend

  worker-generation:
    extends:
      file: docker-compose.service-dev.yml
      service: worker-generation

  worker-export:
    extends:
      file: docker-compose.service-dev.yml
      service: worker-export

  worker-maintenance:
    extends:
      file: docker-compose.service-dev.yml
      service: worker-maintenance

  scheduler:
    extends:
      file: docker-compose.service-dev.yml
      service: scheduler

  frontend:
    extends:
      file: docker-compose.service-dev.yml
      service: frontend
