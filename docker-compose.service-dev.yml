name: academic-pipeline-engine-service-dev

services:
  migrate:
    image: ape-service-dev-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env.service-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: "no"

  backend:
    image: ape-service-dev-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.service-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        BACKEND_API_URL: http://backend:8000
        NEXT_PUBLIC_APE_RUNTIME_PROFILE: service
    ports:
      - "3000:3000"
    environment:
      BACKEND_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
