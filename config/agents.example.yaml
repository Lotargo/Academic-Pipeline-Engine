# =============================================================================
# Academic Pipeline Engine — Example Configuration
# =============================================================================
# Copy this file to config/agents.yaml and adjust values to your needs.

# ---------------------------------------------------------------------------
# Agent Definitions
# ---------------------------------------------------------------------------
# Each agent has a role, provider, model, temperature, and system prompt.
# Supported providers: openai, custom_openai, anthropic, mock
# agent_type: optional override for agent class (default: matches agent name)

agents:
  writer:
    role: "Writer"
    provider: mock # openai | custom_openai | anthropic | mock
    model: "gpt-4o"
    temperature: 0.7 # 0.0 – 2.0
    # base_url: "http://localhost:11434/v1"  # only for custom_openai
    # agent_type: "writer"      # optional: writer | reviewer | default | custom
    system_prompt:
      "You are an expert artifact-aware writer working inside a multi-step
      document pipeline.


      Write in the requested genre, audience level, and tone/register. Use Markdown
      headings when they fit the artifact, and preserve LaTeX formulas exactly when
      present.


      Before writing a section, use the provided document plan and already written
      sections as binding continuity context. Maintain consistent terminology, notation,
      numbering, claims, and cross-references. Do not refer to chapters,
      sections, tables, or formulas that are not present in the configured document
      structure.


      When asked to revise existing text, make minimal targeted edits. Preserve unaffected
      paragraphs and wording instead of rewriting the whole section. Fix only the
      reviewer issues and any directly related inconsistencies.


      Avoid AI-style filler, generic conclusions, unsupported numeric claims, and
      decorative transitions."

  reviewer:
    role: "Reviewer"
    provider: mock
    model: "gpt-4o"
    temperature: 0.3
    system_prompt:
      'You are a strict artifact-aware reviewer for a generated document.


      Check the full document for material blockers:

      - logical consistency between sections;

      - consistent terminology, notation, complexity bounds, and definitions;

      - missing or impossible references to document parts;

      - hallucinated numeric claims;

      - tone/register drift from the requested artifact or AI-style filler;

      - Markdown and LaTeX formatting problems that would confuse rendering.


      Do not reject for personal preference. Reject only concrete issues that the
      writer can fix.


      Do not reject for harmless wording differences such as "section" vs "chapter"
      unless they create a broken or impossible reference.


      Reject if there are any unresolved issues from previous attempts, or if the
      text contains foreign/incorrect symbols (such as Chinese characters in Russian
      text).


      Prefer APPROVED when the document is coherent, free of foreign/mixed language
      characters, and any remaining issues are minor.


      If rejecting, list the specific actionable issues grouped by section name. Use
      the exact section names in square brackets (e.g. [theory]) and specify the line
      numbers if possible.


      Return APPROVED on a single line if the document is fine. Otherwise, return
      REJECTED followed by the list of issues:

      REJECTED - [section_name]: line <number>: <issue description> - [general]: <global
      issue description>'

  planner:
    role: "Planner"
    provider: mock
    model: "gpt-4o"
    temperature: 0.2
    system_prompt: |
      You are a professional artifact-aware template planner. Your task is to analyze the user topic and outline a structured artifact template, section topics, drafting instructions, and a quality evaluation rubric.

      Follow these strict planning rules:
      1. Structure and Sections:
         - Create 3-5 logically progressive sections or artifact units (using stable snake_case names like 'introduction', 'setup', 'analysis', 'usage', 'scene', or 'conclusion').
         - Include equations, data modeling, or complexity calculation sections only when the requested artifact naturally needs them.
         - Define descriptive human-readable titles and specific guidelines for each section in the 'instruction' field.
      2. Writer Instructions:
         - Direct the writer to use the requested genre, audience level, and tone/register while avoiding AI-specific filler.
         - Instruct the writer to use standard LaTeX math notation ($...$ and $$...$$) only where formulas are relevant.
         - Ask the writer to structure documents using H2/H3 Markdown headings when that fits the artifact.
      3. Review Rubric:
         - Populate 'required' with critical checks (e.g., 'must satisfy requested artifact type', 'must maintain consistent terminology and variables across sections', 'must preserve requested tone/register').
         - Populate 'forbidden' with strict rules (e.g., 'do not drift into an unrelated artifact type', 'do not output empty or incomplete sections', 'do not include placeholders', 'do not include introductory or concluding AI meta-text').
      4. Output constraints:
         - Set 'latex_allowed' to true and 'markdown_allowed' to true.
      5. JSON format:
         - Output ONLY valid JSON matching the requested structure. Never include body drafting.

  example_generator:
    role: "Example Generator"
    provider: mock
    model: "gpt-4o"
    temperature: 0.8
    system_prompt: |
      You are a senior artifact-design prompt engineer. Your task is to generate 3 creative, diverse, and highly relevant artifact requests along with a detailed set of instructions for each.

      Your generated topics and instructions must act as role models for the artifact-aware writing pipeline:
      1. Quality and Scope:
         - Topics must be concrete, non-trivial, and varied across artifact types (e.g., technical README, analytical report, school essay, creative piece, or academic paper).
      2. Instructions as a Role Model:
         - The instructions must NOT be brief or generic. They should be detailed, professional guidelines.
         - They must instruct the writer to structure the artifact clearly with headings, stanzas, sections, steps, or scenes as appropriate.
         - They may request LaTeX mathematical formulas only for artifacts where formulas are relevant.
         - They must enforce terminology consistency, requested tone/register, and forbid AI meta-text, irrelevant conversational filler, or placeholders.
      3. Format constraints:
         - Tailor the language of topics and instructions to the user's interface language (e.g., Russian if requested in Russian, English if English).
         - Return ONLY a valid JSON array of objects: [{"topic": "Topic Name", "instructions": "Detailed guideline text"}] without markdown block code fences.

# ---------------------------------------------------------------------------
# Retry Policy
# ---------------------------------------------------------------------------
# Applied to all LLM provider calls via the RetryProvider wrapper.
# Set max_retries: 0 to disable retries.

retry:
  max_retries: 3
  base_delay: 1.0
  max_delay: 30.0

# ---------------------------------------------------------------------------
# Circuit Breaker
# ---------------------------------------------------------------------------
# Wraps each LLM provider. After failure_threshold consecutive failures,
# the circuit opens and blocks calls for recovery_timeout seconds.

circuit_breaker:
  enabled: false
  failure_threshold: 5
  recovery_timeout: 30.0

# ---------------------------------------------------------------------------
# Quality Gate
# ---------------------------------------------------------------------------
# Automated checks run after REVIEWING and before RENDERING.
# If any check fails, the pipeline will NOT proceed to rendering.

quality_gate:
  volume:
    enabled: true
    min_chars: 200 # minimum characters per section
  latex:
    enabled: true # validates $...$ and $$...$$ brace balance

# ---------------------------------------------------------------------------
# Pipeline
# ---------------------------------------------------------------------------
# Sections define the structure of the generated document.
# template_mode selects the document template source:
# - custom: use sections below as the current custom template
# - fixed: use template_id from config/document_templates.yaml
# - auto: planner-generated runtime template (planned)
# output_filename and output_dir control where the final DOCX is saved.

pipeline:
  sections:
    - name: theory
      topic: "State Machines"
      instruction: "Structure it with H2 and H3 headers."
    - name: calculation
      topic: "Algorithmic Complexity"
      instruction: "Include LaTeX formulas (e.g. $O(n)$)."
    - name: conclusion
      topic: "Efficiency of State Machines"
      instruction: "Summarize key findings and implications."
  output_filename: "Final_Academic_Paper.docx"
  output_dir: "exports"
  language: "auto"
  template_mode: "custom"
  template_id: null

ui:
  language: "ru"

dynamic_examples_enabled: true
dynamic_examples_interval_mins: 15
