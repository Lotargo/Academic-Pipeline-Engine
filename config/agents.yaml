agents:
  writer:
    role: Writer
    provider: zen
    model: mimo-v2.5-free
    temperature: 0.7
    system_prompt: 'You are an expert academic writer.

      Your goal is to draft sections of a technical paper based on provided instructions.

      Use formal language, avoid cliches, and structure your output in Markdown.

      '
  reviewer:
    role: Reviewer
    provider: zen
    model: mimo-v2.5-free
    temperature: 0.3
    system_prompt: 'You are a strict academic reviewer.

      Your goal is to check the drafted text for logic errors, informal language,
      and AI markers.

      Return exactly one line: APPROVED if the text passes, or REJECTED followed by
      a brief reason.

      '
retry:
  max_retries: 3
  base_delay: 1
  max_delay: 30
circuit_breaker:
  enabled: false
  failure_threshold: 5
  recovery_timeout: 30
quality_gate:
  volume:
    enabled: true
    min_chars: 200
  latex:
    enabled: true
pipeline:
  sections:
  - name: theory
    topic: State Machines
    instruction: Structure it with H2 and H3 headers.
  - name: calculation
    topic: Algorithmic Complexity
    instruction: Include LaTeX formulas (e.g. $O(n)$).
  - name: conclusion
    topic: Efficiency of State Machines
    instruction: Summarize key findings and implications.
  output_filename: Final_Academic_Paper.docx
  output_dir: exports
  language: auto
style:
  font_name: Times New Roman
  font_size: 14
  title_font_size: 20
  line_spacing: 1.5
  first_line_indent_cm: 1.25
  alignment: justify
ui:
  language: ru
