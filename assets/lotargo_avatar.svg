<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" /> <!-- Blue -->
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" /> <!-- Violet -->
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: Deep Tech Dark -->
  <rect width="400" height="400" fill="#0f172a"/>

  <!-- Main Group: Centered -->
  <g transform="translate(200, 200)" filter="url(#glow)">

    <!-- Abstract Construct: The Gateway/Orchestrator -->
    <!-- Represents stability (Hexagon) and flow (Lines) -->

    <!-- Outer Ring Segments -->
    <path d="M0,-110 L95,-55" stroke="url(#grad)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M95,55 L0,110" stroke="url(#grad)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M-95,55 L-95,-55" stroke="url(#grad)" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Inner Core Structure -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#fff" stroke-width="4" opacity="0.9"/>
    <circle cx="0" cy="0" r="15" fill="#fff"/>

    <!-- Data Streams Connecting to Core -->
    <line x1="0" y1="-110" x2="0" y2="-50" stroke="url(#grad)" stroke-width="4" opacity="0.6"/>
    <line x1="95" y1="55" x2="40" y2="25" stroke="url(#grad)" stroke-width="4" opacity="0.6"/>
    <line x1="-95" y1="55" x2="-40" y2="25" stroke="url(#grad)" stroke-width="4" opacity="0.6"/>

    <!-- Floating Particles (Idea/Spark) -->
    <circle cx="60" cy="-60" r="6" fill="#38bdf8"/>
    <circle cx="-70" cy="20" r="4" fill="#a855f7"/>

  </g>
</svg>
